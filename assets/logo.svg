<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Ting Ting">
  <g fill="none" stroke="#5B9CD6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open ring: leaves a gap at the lower right, sweeps the long way round,
         and runs out tangentially into the arrow shaft at about 4 o'clock. -->
    <path d="M46.61 71.89 A30 30 0 1 1 72.19 52.26 L72.19 70" />
    <!-- Dollar sign: an S with the stem running past it top and bottom. -->
    <path d="M57 33.5
             C57 29 51 26 44 26
             C37.5 26 31 29 31 34.5
             C31 40 37 42 44 43.5
             C51 45 57 47 57 52
             C57 57 50.5 60 44 60
             C37 60 31 57 31 52.5" />
    <path d="M44 21 L44 63" />
  </g>
  <!-- Arrowhead, filled so it reads solid at small sizes. -->
  <path d="M60.5 68 H83.9 L72.2 86 Z" fill="#5B9CD6" />
</svg>
